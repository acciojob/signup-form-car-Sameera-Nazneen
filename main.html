<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>

	<form method = "post">
		<label for = "name">Name</label>
		<input type = "text" required = "yes" id = "name" placeholder = "name"/>
		<br>
		<label for = "email">Email</label>
		<input type = "Email" required id = "email" placeholder = "Email"/>
		<br>
		<label for = "gender_m,gender_f">Gender</label>
		<input type = "radio" required id = "gender_m" name = "gender"/>Male
		<input type = "radio" required id = "gender_f" name = "gender"/>Female
		<br>
		<label>Car Brands</label>
		<select multiple id = "cars" required placeholder = "--Please choose an option--"> 
			<option>TATA</option>
			<option>Honda</option>
			<option>BMW</option>
			<option>Audi</option>
			<option>Thar</option>
		</select>
		<br>
		<label for = "age">Age</label>
		<input type = "number" reqiured id= "age" placeholder = "Age"/>
		<br>
		<label for = "dob">DOB</label>
		<input type = "date" required id = "dob"/>
		<br>
		<label for ="tel">Phone Number</label>
		<input type = "tel" id = "tel" placeholder = "xxx-xxx-xxxx"/>
		<br>
		<label for = "password">Password</label>
		<input type = "password" required id = "password" placeholder = "Password"/>
		<br>
		<input type = "checkbox" required id = "tos"/>I agree to the TOS
		<br>
		<button type = submit>submit</button>
	</form>

</body>

</html>
